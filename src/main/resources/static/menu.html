<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Gerdau de Códigos e Contratos</title>

  
  <link rel="stylesheet" href="design/portal.css">
<link rel="stylesheet" href="design/theme.css"><script src="session.js"></script></head>

<body class="portal-page">

  
  <header class="topo">
    <img class="topo-logo" src="design/logo-gerdau.png" alt="Gerdau">

    
    <a class="botao-voltar" href="catalogo.html">Catálogo →</a>
  </header>

  
  <main class="conteudo">

    
    <div class="titulo-bloco">
      <div class="divisor">
        <span class="linha"></span>
        <img class="divisor-gg" src="design/gg-icone.png" alt="">
        <span class="linha"></span>
      </div>
      <h1>Encontre seus <span class="destaque">códigos</span> aqui</h1>
    </div>

    
    <nav class="cartoes">

      
      <a class="cartao" href="index.html?modo=pesquisa">
        <div class="cartao-topo">
          <div class="icone-caixa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
          </div>
          <h2>Pesquisa<br>de código</h2>
        </div>
        <p>Aqui você consegue encontrar todos os códigos e códigos similares</p>
        <span class="seta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </span>
      </a>

      
      <a class="cartao" href="catalogo.html">
        <div class="cartao-topo">
          <div class="icone-caixa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>
          </div>
          <h2>Formulário</h2>
        </div>
        <p>Criar ou utilizar formulários para criação de contratos ou novos códigos</p>
        <span class="seta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </span>
      </a>

      
      <a class="cartao" aria-disabled="true" tabindex="-1">
        <div class="cartao-topo">
          <div class="icone-caixa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
          </div>
          <h2>Dashboard</h2>
        </div>
        <p>Em planejamento · disponível em uma próxima etapa</p>
        <span class="seta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </span>
      </a>

    </nav>
  </main>

  
  <div class="onda-rodape" aria-hidden="true"></div>

</body>
</html>

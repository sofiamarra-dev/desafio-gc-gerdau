spring.application.name=demo
python.ai.url=${PYTHON_AI_URL:http://127.0.0.1:8001}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/gerdau}
spring.datasource.username=${DB_USER:gerdau}
spring.datasource.password=${DB_PASSWORD:gerdau_local}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

cleanup.directory=${CLEANUP_DIRECTORY:./data/cleanups}

auth.token.url=${AUTH_TOKEN_URL:http://127.0.0.1:5000}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

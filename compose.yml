services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gerdau
      POSTGRES_USER: ${DB_USER:-gerdau}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gerdau_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d gerdau"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build:
      context: .
      dockerfile: ai-python/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PYTHON_DATA_DIR: /data
      HF_HOME: /models
    ports:
      - "127.0.0.1:${AI_PORT:-8001}:8001"
    volumes:
      - ai_data:/data
      - model_cache:/models
    healthcheck:
      # Responder HTTP basta: o Java precisa iniciar para reconstruir um índice antigo.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/status', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 60
    stop_grace_period: 60s

  java:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DB_URL: jdbc:postgresql://db:5432/gerdau
      DB_USER: ${DB_USER:-gerdau}
      DB_PASSWORD: ${DB_PASSWORD:-gerdau_local}
      PYTHON_AI_URL: http://ai:8001
    ports:
      - "127.0.0.1:${JAVA_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/api/catalog/status"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20
    stop_grace_period: 30s

volumes:
  postgres_data:
  ai_data:
  model_cache:
